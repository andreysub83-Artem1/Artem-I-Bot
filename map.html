<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор места на карте</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Яндекс.Карты -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=fb47fb22-9f8c-468d-95a5-aebccd116ac8&lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 90%; }
        .btn-container { height: 10%; display: flex; justify-content: center; align-items: center; background: #f0f0f0; }
        button {
            background: #D4AF37; /* Золото ALMAZ */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="map"></div>
<div class="btn-container">
    <button id="sendBtn">📍 Отправить координаты</button>
</div>

<script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand(); // Раскрыть на весь экран

    let myMap;
    let myPlacemark;

    ymaps.ready(init);

    function init() {
        // Центр карты: Южно-Сахалинск (можно поменять на Корсаков или свой адрес)
        myMap = new ymaps.Map("map", {
            center: [46.958, 142.723], 
            zoom: 12
        });

        // Обработка клика по карте
        myMap.events.add('click', function (e) {
            const coords = e.get('coords');
            
            // Если метка уже есть - удаляем старую
            if (myPlacemark) {
                myMap.geoObjects.remove(myPlacemark);
            }

            // Ставим новую метку
            myPlacemark = new ymaps.Placemark(coords, {}, {
                preset: 'islands#redDotIcon'
            });
            myMap.geoObjects.add(myPlacemark);
        });
    }

    // Кнопка отправки
    document.getElementById('sendBtn').onclick = function() {
        if (!myPlacemark) {
            tg.showAlert('⚠️ Сначала выберите место на карте!');
            return;
        }
        
        const coords = myPlacemark.geometry.getCoordinates();
        // Формируем данные для отправки в бота (JSON)
        const data = JSON.stringify({
            command: 'location',
            latitude: coords[0],
            longitude: coords[1]
        });

        // Отправляем данные обратно в бот
        tg.sendData(data);
    };
</script>

</body>
</html>
