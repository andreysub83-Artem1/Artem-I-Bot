<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTEM AI - Недвижимость</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.95;
            font-weight: 400;
            line-height: 1.5;
        }

        .question {
            font-size: 18px;
            margin-bottom: 25px;
            opacity: 0.95;
            font-weight: 500;
            line-height: 1.6;
        }

        .input-name {
            width: 100%;
            max-width: 300px;
            padding: 15px 25px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255,255,255,0.95);
            color: #333;
            margin-bottom: 25px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-name:focus {
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 60px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .greeting {
            font-size: 36px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .welcome-text {
            font-size: 20px;
            margin-bottom: 15px;
            opacity: 0.95;
        }

        .help-text {
            font-size: 18px;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.95;
            font-weight: 500;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .menu-item {
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 22px 25px;
            border-radius: 18px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .menu-item:active {
            transform: translateY(-2px);
        }

        .emoji {
            font-size: 28px;
            margin-right: 10px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Презентация -->
    <div class="screen active" id="screen1">
        <div class="logo">ARTEM AI</div>
        <div class="subtitle">Ваш умный помощник в сфере недвижимости</div>
        <div class="question">
            Подскажите, пожалуйста,<br>
            как я могу к Вам обращаться?
        </div>
        <input type="text" class="input-name" id="userNameInput" placeholder="Введите ваше имя">
        <button class="btn-primary" onclick="goToScreen2()">
            Продолжить →
        </button>
    </div>

    <!-- ЭКРАН 2: Меню -->
    <div class="screen" id="screen2">
        <div class="greeting" id="greetingText">Имя! 👋</div>
        <div class="welcome-text">Рад Вас приветствовать!</div>
        <div class="help-text">Я здесь чтобы Вам помочь.</div>
        <div class="question-text">Какой вопрос Вас интересует?</div>

        <div class="menu-container">
            <div class="menu-item" onclick="sendAction('sell')">
                <span class="emoji">💰</span>Продать
            </div>
            <div class="menu-item" onclick="sendAction('buy')">
                <span class="emoji">🏡</span>Купить
            </div>
            <div class="menu-item" onclick="sendAction('rent')">
                <span class="emoji">🔑</span>Аренда
            </div>
            <div class="menu-item" onclick="sendAction('mortgage')">
                <span class="emoji">📊</span>Ипотека
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let userName = '';

        function goToScreen2() {
            const input = document.getElementById('userNameInput');
            userName = input.value.trim();

            if (userName === '') {
                tg.showAlert('Пожалуйста, введите ваше имя');
                return;
            }

            document.getElementById('greetingText').textContent = userName + '! 👋';

            document.getElementById('screen1').classList.remove('active');
            const screen2 = document.getElementById('screen2');
            screen2.classList.add('active');
            screen2.classList.add('animate-in');
        }

        function sendAction(action) {
            tg.sendData(JSON.stringify({
                action: action,
                name: userName
            }));
        }

        document.getElementById('userNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                goToScreen2();
            }
        });
    </script>
</body>
</html>
