<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEM AI — Недвижимость</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .logo {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 17px;
            margin-bottom: 36px;
            opacity: 0.95;
            font-weight: 400;
            line-height: 1.5;
            max-width: 280px;
        }

        .question {
            font-size: 18px;
            margin-bottom: 28px;
            opacity: 0.98;
            font-weight: 500;
            line-height: 1.6;
        }

        .greeting {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .welcome-text {
            font-size: 19px;
            margin-bottom: 12px;
            opacity: 0.98;
        }

        .help-text {
            font-size: 17px;
            margin-bottom: 32px;
            opacity: 0.92;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 28px;
            opacity: 0.96;
            font-weight: 500;
        }

        .input-name {
            width: 100%;
            max-width: 320px;
            padding: 16px 28px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 28px;
            font-size: 17px;
            background: rgba(255,255,255,0.98);
            color: #2d3748;
            margin-bottom: 24px;
            outline: none;
            transition: all 0.25s ease;
            text-align: center;
        }

        .input-name::placeholder {
            color: #718096;
            opacity: 1;
        }

        .input-name:focus {
            border-color: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2);
            transform: scale(1.02);
        }

        .input-error {
            border-color: #fc8181 !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 56px;
            border-radius: 32px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.35);
        }

        .btn-primary:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            padding: 0 8px;
        }

        .menu-item {
            background: rgba(255,255,255,0.98);
            color: #2d3748;
            padding: 20px 24px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transition: all 0.2s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .menu-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.2);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .menu-item:active {
            transform: translateY(-1px);
            background: rgba(255,255,255,1);
        }

        .emoji {
            font-size: 26px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @media (max-width: 380px) {
            .logo { font-size: 40px; }
            .greeting { font-size: 28px; }
            .menu-item { font-size: 17px; padding: 18px 20px; }
            .btn-primary { padding: 16px 48px; font-size: 17px; }
        }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Презентация -->
    <div class="screen active" id="screen1">
        <div class="logo">ARTEM AI</div>
        <div class="subtitle">Ваш умный помощник в сфере недвижимости</div>
        <div class="question">
            Подскажите, пожалуйста,<br>
            как я могу к Вам обращаться?
        </div>
        <input 
            type="text" 
            class="input-name" 
            id="userNameInput" 
            placeholder="Введите ваше имя"
            maxlength="30"
            autocomplete="name"
        >
        <button class="btn-primary" onclick="goToScreen2()">
            Продолжить →
        </button>
    </div>

    <!-- ЭКРАН 2: Меню -->
    <div class="screen" id="screen2">
        <div class="greeting" id="greetingText">Имя! 👋</div>
        <div class="welcome-text">Рад Вас приветствовать!</div>
        <div class="help-text">Я здесь, чтобы Вам помочь.</div>
        <div class="question-text">Какой вопрос Вас интересует?</div>

        <div class="menu-container">
            <div class="menu-item" onclick="sendAction('sell')">
                <span class="emoji">💰</span>Продать
            </div>
            <div class="menu-item" onclick="sendAction('buy')">
                <span class="emoji">🏡</span>Купить
            </div>
            <div class="menu-item" onclick="sendAction('rent')">
                <span class="emoji">🔑</span>Аренда
            </div>
            <div class="menu-item" onclick="sendAction('mortgage')">
                <span class="emoji">📊</span>Ипотека
            </div>
            <div class="menu-item" onclick="sendAction('ai')">
                <span class="emoji">🤖</span>Вопрос AI
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.colorScheme === 'dark') {
            document.body.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
        }

        let userName = '';

        function goToScreen2() {
            const input = document.getElementById('userNameInput');
            userName = input.value.trim();

            if (userName === '' || userName.length < 2) {
                input.classList.add('input-error');
                tg.showAlert('Пожалуйста, введите ваше имя (минимум 2 символа)');
                setTimeout(() => input.classList.remove('input-error'), 500);
                input.focus();
                return;
            }

            document.getElementById('greetingText').textContent = userName + '! 👋';

            document.getElementById('screen1').classList.remove('active');
            const screen2 = document.getElementById('screen2');
            screen2.classList.add('active');
            screen2.classList.add('animate-in');

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function sendAction(action) {
            tg.sendData(JSON.stringify({
                command: action,
                name: userName
            }));

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        document.getElementById('userNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                goToScreen2();
            }
        });

        window.addEventListener('load', function() {
            document.getElementById('userNameInput').focus();
        });
    </script>
</body>
</html>
